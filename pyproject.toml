[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lena"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39",
    "openai>=1.50",
    "google-genai>=0.3",
    "ollama>=0.3",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-api>=1.27",
    "pyyaml>=6",
    "pydantic>=2.8",
    "typing-extensions>=4.9",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "langgraph>=0.2,<0.3",
    "mem0ai>=0.1.40",
    "zep-python>=2.0",
    "tiktoken>=0.7",
    "click>=8.1",
    "langfuse>=2.40",
    "pgvector>=0.3",
    "requests>=2.31",
    "textual>=0.61",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
lena = "lena.cli:cli"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running PostgreSQL database (deselect with -m 'not integration')",
]
